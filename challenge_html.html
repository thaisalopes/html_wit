<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="card">
      <img
        src="illustration-article.svg"
        alt="Article Illustration"
        class="card-img"
      />

      <div class="content">
        <p class="tag">Learning</p>

        <a href="#" class="title">HTML & CSS Foundations</a>

        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

      <footer class="author">
        <img src="image-avatar.webp" alt="Avatar" class="avatar" />
        <p class="author-name">Greg Hooper</p>
      </footer>
      </div>
    </main>
  </body>
</html>
